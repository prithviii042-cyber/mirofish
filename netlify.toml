[build]
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# Proxy all /api/* requests to the Railway backend.
# Replace YOUR_RAILWAY_URL with your actual Railway service URL, e.g.:
#   https://mirofish-backend.up.railway.app
[[redirects]]
  from   = "/api/*"
  to     = "https://YOUR_RAILWAY_URL/api/:splat"
  status = 200
  force  = true

# SPA fallback: send all other routes to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
